name: decky

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/decky.yml"
      - "decky/**"
  push:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/decky.yml"
      - "decky/**"

permissions:
  contents: read

jobs:
  plugin:
    name: Decky plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: decky
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend tests
        run: python -m unittest discover -s tests -t .
      - name: Install frontend dependencies
        run: npx --yes pnpm@9 install
      - name: Typecheck
        run: npx --yes pnpm@9 run typecheck
      - name: Build
        run: npx --yes pnpm@9 run build
      - name: Package
        run: npx --yes pnpm@9 run package
      - uses: actions/upload-artifact@v4
        with:
          name: OpenNOW-decky
          path: decky/out/OpenNOW.zip
          if-no-files-found: error
